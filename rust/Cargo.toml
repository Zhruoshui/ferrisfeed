[package]
name = "rust_lib_rss_reader"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { git = "https://github.com/fzyzcjy/flutter_rust_bridge", rev = "254b193", features = [
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.23", features = ["v4", "serde"] }
# P0b: SQLite persistence. `bundled` compiles SQLite from source (FTS5/JSON1/RTREE
# enabled) so the same build works on android/ios/linux/macos/windows with no
# system-library dependency.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
parking_lot = "0.12"
# P1a: feed parsing + HTTP fetching + HTML auto-discovery.
# feed-rs parses Atom/RSS2/RSS1/JSON-Feed into a unified model (content:encoded,
# media:*, enclosure, normalized dates) — replaces the hand-rolled parser in
# reader.rs for the new persisted feed path. Its deps (chrono/serde/url/uuid)
# already overlap ours; it only adds quick-xml/mediatype/regex/siphasher +
# optional ammonia (via the `sanitize` feature).
feed-rs = { version = "2.4", features = ["sanitize"] }
# reqwest 0.13 defaults to rustls (aws-lc-rs) + rustls-platform-verifier, which
# delegates cert validation to the OS trust store on mobile (Android Keystore,
# iOS Keychain) — no OpenSSL to cross-compile. HTTP fetching stays fully
# decoupled from feed-rs (fetch bytes -> hand to feed-rs).
reqwest = { version = "0.13", features = ["gzip", "brotli"] }
# tokio runtime for async reqwest; FRB async fns spawn onto this runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# scraper (html5ever + selectors) for feed auto-discovery via <link rel=alternate>.
scraper = "0.22"
# P1b: simhash near-duplicate detection (ports Livo entry-simhash.ts). SHA-1 per
# token, 64-bit fingerprint, Hamming distance <= 9. `regex` is already a
# transitive dep of feed-rs; declaring it directly keeps the simhash tokenizer
# self-contained. `unicode-normalization` provides NFKC folding for parity.
sha1 = "0.10"
regex = "1"
unicode-normalization = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
